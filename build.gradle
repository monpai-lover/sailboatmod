plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
def fixIndex = (project.findProperty('fixIndex') ?: '').toString().trim()
def releaseVersion = "${mod_version}${fixIndex ? "-fix_${fixIndex}" : ''}"
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = file('run-neoforge')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.sailboatmod
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://ldtteam.jfrog.io/artifactory/modding' }
    maven { url = 'https://repo.essential.gg/repository/maven-public' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
configurations { sqliteEmbeddedLibrary { transitive = false } }
dependencies {
    implementation "maven.modrinth:geckolib:${geckolib_version_id}"
    jarJar(implementation("com.ldtteam:blockui:${blockui_version}") { transitive = false }) { version { strictly "[${blockui_version}]"; prefer blockui_version } }
    jarJar(implementation('com.badlogicgames.gdx:gdx-ai:1.8.2')) { version { strictly '[1.8.2,1.9)'; prefer '1.8.2' } }
    jarJar(implementation('com.badlogicgames.gdx:gdx:1.9.0')) { version { strictly '[1.9.0,2.0)'; prefer '1.9.0' } }
    jarJar(implementation('org.sejda.imageio:webp-imageio:0.1.6')) { version { strictly '[0.1.6,0.1.7)'; prefer '0.1.6' } }
    jarJar(implementation("gg.essential:elementa:${elementa_version}")) { version { strictly "[${elementa_version},800)"; prefer elementa_version } }
    jarJar(implementation("gg.essential:universalcraft-${universalcraft_minecraft_version}-neoforge:${universalcraft_version}")) { version { strictly "[${universalcraft_version},600)"; prefer universalcraft_version } }
    jarJar(implementation("org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}")) { version { strictly "[${kotlin_version},3.0)"; prefer kotlin_version } }
    jarJar(implementation("org.jetbrains.kotlin:kotlin-reflect:${kotlin_version}")) { version { strictly "[${kotlin_version},3.0)"; prefer kotlin_version } }
    runtimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    sqliteEmbeddedLibrary("org.xerial:sqlite-jdbc:3.46.1.3")
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
def marketWebBundledMinecraftAssetsDir = layout.buildDirectory.dir('generated/marketWebMinecraftAssets')
tasks.register('bundleMarketWebMinecraftAssets', Sync) {
    group = 'market web'
    description = 'Bundle cached Minecraft 1.21.1 icon assets. Use -PmarketWebMinecraftAssetsSource=<path>.'
    into marketWebBundledMinecraftAssetsDir
    def configured = providers.gradleProperty('marketWebMinecraftAssetsSource').orElse('src/generated/marketweb-minecraft-assets')
    from(configured) {
        include 'assets/minecraft/blockstates/**', 'assets/minecraft/models/**', 'assets/minecraft/textures/**'
    }
}
sourceSets.main.resources.srcDir marketWebBundledMinecraftAssetsDir
def expandedProperties = [
    minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
    neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
    mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
    mod_authors: mod_authors, mod_description: mod_description,
    market_web_mod_id: 'sailboatmarketweb', market_web_mod_name: "${mod_name} Market Web"
]
tasks.named('processResources', ProcessResources) {
    dependsOn 'bundleMarketWebMinecraftAssets'
    dependsOn 'processMarketWebResources'
    // The isolated development module cannot resolve the runtime JDBC driver;
    // provide the same inert resource used by the production jar's loader.
    from(configurations.sqliteEmbeddedLibrary) { into 'META-INF/sailboatmod-libs' }
    inputs.properties expandedProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand expandedProperties }
    // Development compiles both entrypoints in one source tree; both must have
    // metadata in that same virtual mod file. Production jars split them below.
    doLast {
        def mainMetadata = destinationDir.toPath().resolve('META-INF/neoforge.mods.toml').toFile()
        def addonMetadata = layout.buildDirectory.file('generated/marketWebResources/META-INF/neoforge.mods.toml').get().asFile.text
        def addonStart = addonMetadata.indexOf('[[mods]]')
        if (addonStart < 0) throw new GradleException('Missing market web addon metadata')
        mainMetadata.append('\n# DEVELOPMENT_MARKET_WEB_METADATA\n' + addonMetadata.substring(addonStart), 'UTF-8')
    }
}
def marketWebResourcesDir = layout.buildDirectory.dir('generated/marketWebResources')
tasks.register('processMarketWebResources', ProcessResources) {
    from 'src/marketweb/resources'
    into marketWebResourcesDir
    inputs.properties expandedProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand expandedProperties }
}
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-${releaseVersion}-neoforge-${minecraft_version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'com/monpai/sailboatmod/market/web/**', 'marketweb/**'
    filesMatching('META-INF/neoforge.mods.toml') {
        def developmentSuffix = false
        filter { line ->
            if (line == '# DEVELOPMENT_MARKET_WEB_METADATA') developmentSuffix = true
            developmentSuffix ? null : line
        }
    }
    manifest { attributes 'Implementation-Version': mod_version }
}
tasks.register('marketWebJar', Jar) {
    archiveFileName = "${mod_id}-marketweb-${releaseVersion}-neoforge-${minecraft_version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn 'classes', 'processMarketWebResources'
    from(sourceSets.main.output) {
        include 'com/monpai/sailboatmod/market/web/**', 'marketweb/**', 'assets/minecraft/**'
    }
    from marketWebResourcesDir
}
tasks.register('releaseMod') {
    group = 'build'
    description = 'Build the NeoForge main mod with bundled libraries and the server market web addon.'
    dependsOn 'build', 'marketWebJar'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xmaxerrs', '2000'
}
tasks.named('test', Test) {
    useJUnitPlatform()
}
// ModDevGradle sets an isolated default working directory after evaluation;
// these existing source/resource contract tests resolve paths from the project.
afterEvaluate {
    tasks.named('test', Test) { workingDir projectDir }
}
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
idea { module { downloadSources = true } }
