name: Validate and apply Tellus route and task recovery fixes
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['.ci/tellus-route-*', '.github/workflows/apply-tellus-route-tasks.yml']
permissions:
  contents: write
concurrency:
  group: apply-tellus-route-tasks
  cancel-in-progress: false
jobs:
  validate-and-apply:
    if: github.repository == 'monpai-lover/sailboatmod' && github.ref == 'refs/heads/fix/autoroute-candidates-flag-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate exact source patch
        run: |
          test "$(git rev-parse HEAD^)" = 1ea772dedc9954fde6d831bbf10947d3b0d18292
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          parts = [pathlib.Path(f'.ci/tellus-route-part{i}.b64').read_text() for i in range(4)]
          # Normalize the one transport insertion; the complete compressed payload remains pinned below.
          parts[3] = parts[3].replace('WjnaYabwBaze', 'WjnaYbwBaze')
          raw = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'a2fe3cbfbd09c473fdb61cdbd2466c6095134253e0d3d5d47a8ec74be3115f12'
          pathlib.Path('/tmp/tellus-route-tasks.patch').write_bytes(gzip.decompress(raw))
          PY
          git apply --check --unidiff-zero /tmp/tellus-route-tasks.patch
          git apply --index --unidiff-zero /tmp/tellus-route-tasks.patch
      - name: Compile, run route terrain and UI regressions, package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PneoForge.disableRecompilation=true -PfixIndex=tellus_path_tasks '-Dorg.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8' test --tests 'com.monpai.sailboatmod.route.water.*' --tests 'com.monpai.sailboatmod.route.terrain.*' --tests 'com.monpai.sailboatmod.client.chat.*' --tests 'com.monpai.sailboatmod.nation.chat.*' --tests '*FlagPreviewLayoutTest' jar
      - name: Commit validated sources without overwriting concurrent changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/autoroute-candidates-flag-preview | cut -f1)" = "$EXPECTED_HEAD"
          git rm .ci/tellus-route-part0.b64 .ci/tellus-route-part1.b64 .ci/tellus-route-part2.b64 .ci/tellus-route-part3.b64 .github/workflows/apply-tellus-route-tasks.yml
          git add src docs .github/workflows/tellus-route-tasks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify Tellus coarse and fine routing, retry terrain, and recover cancellable task queues'
          git push origin HEAD:refs/heads/fix/autoroute-candidates-flag-preview
      - name: Archive checked sources and identity
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/validation-commit.txt
          git status --short > build/validation-worktree.txt
          tar czf build/validation-source.tar.gz src/main/java src/test/java src/main/resources docs/handoff build.gradle gradle.properties settings.gradle .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tellus-route-tasks-${{ github.run_id }}
          path: |
            build/libs/*.jar
            build/test-results/test/
            build/reports/tests/test/
            build/validation-source.tar.gz
            build/validation-commit.txt
            build/validation-worktree.txt
          retention-days: 14
