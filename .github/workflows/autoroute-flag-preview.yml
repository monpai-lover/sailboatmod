name: Auto-route and flag preview checks

on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
  pull_request:
    branches: [1.21.1-neoforge]
    paths:
      - 'src/main/java/com/monpai/sailboatmod/route/water/**'
      - 'src/main/java/com/monpai/sailboatmod/network/packet/RequestAutoRouteDocksPacket.java'
      - 'src/main/java/com/monpai/sailboatmod/client/ui/territory/FlagPreview*.java'
      - 'src/test/java/com/monpai/sailboatmod/route/water/WaterRouteCandidateServiceTest.java'
      - 'src/test/java/com/monpai/sailboatmod/client/ui/territory/FlagPreviewLayoutTest.java'
      - '.github/workflows/autoroute-flag-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoroute-flag-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, run focused regressions, and package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PneoForge.disableRecompilation=true \
            '-Dorg.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8' \
            test --tests '*WaterRouteCandidateServiceTest' --tests '*FlagPreviewLayoutTest' jar
      - name: Upload test reports and built jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoroute-flag-preview-${{ github.sha }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
