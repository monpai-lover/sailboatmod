name: Saved terrain and routing regression
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['src/main/java/com/monpai/sailboatmod/route/**', 'src/main/java/com/monpai/sailboatmod/util/OfflineChunkPalette.java', 'src/test/**', '.github/workflows/proto-region-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proto-region-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, regress and package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PneoForge.disableRecompilation=true -PfixIndex=proto_region_retry '-Dorg.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8' test --tests '*route.water.*' --tests '*route.terrain.*' --tests '*OfflineChunkPaletteTest' --tests '*ChatFlag*Test' --tests '*NationOfficeTitleTest' --tests '*FlagPreviewLayoutTest' jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-region-regression-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/test-results/test/
            build/reports/tests/test/
          retention-days: 14
