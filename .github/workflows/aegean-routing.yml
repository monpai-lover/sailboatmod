name: Aegean nonblocking terrain regression
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['src/**', '.github/workflows/aegean-routing.yml']
  pull_request:
    branches: [1.21.1-neoforge]
    paths: ['src/**', '.github/workflows/aegean-routing.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegean-terrain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, test real coastline and port fixtures, package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PneoForge.disableRecompilation=true -PfixIndex=aegean_async '-Dorg.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8' test --tests 'com.monpai.sailboatmod.route.water.*' --tests 'com.monpai.sailboatmod.route.terrain.*' --tests '*ChatFlag*Test' --tests '*NationOfficeTitleTest' --tests '*FlagPreviewLayoutTest' jar
      - name: Archive checked sources
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/validation-commit.txt
          tar czf build/validation-source.tar.gz src/main/java src/test src/main/resources docs/handoff/AEGEAN_NONBLOCKING_TERRAIN.md tools/generate_aegean_fixture.py build.gradle gradle.properties settings.gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegean-terrain-${{ github.run_id }}
          path: |
            build/libs/*.jar
            build/test-results/test/
            build/reports/tests/test/
            build/route-regression/
            build/validation-source.tar.gz
            build/validation-commit.txt
          retention-days: 14
