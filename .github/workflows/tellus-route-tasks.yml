name: Tellus routing and task queue verification
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['src/**', 'build.gradle', '.github/workflows/tellus-route-tasks.yml']
  pull_request:
    branches: [1.21.1-neoforge]
    paths: ['src/**', 'build.gradle', '.github/workflows/tellus-route-tasks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tellus-route-tasks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, regress and package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PneoForge.disableRecompilation=true -PfixIndex=tellus_path_tasks '-Dorg.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8' test --tests 'com.monpai.sailboatmod.route.water.*' --tests 'com.monpai.sailboatmod.route.terrain.*' --tests 'com.monpai.sailboatmod.client.chat.*' --tests 'com.monpai.sailboatmod.nation.chat.*' --tests '*FlagPreviewLayoutTest' jar
      - name: Archive sources
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/validation-commit.txt
          tar czf build/validation-source.tar.gz src/main/java src/test/java src/main/resources docs/handoff build.gradle gradle.properties settings.gradle .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tellus-route-tasks-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/test-results/test/
            build/reports/tests/test/
            build/validation-source.tar.gz
            build/validation-commit.txt
          retention-days: 14
