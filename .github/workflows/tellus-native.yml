name: Tellus native terrain validation
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['tools/tellus-native/**', '.github/workflows/tellus-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tellus-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned native runtime and record API identity
        run: |
          mkdir -p build/native-runtime build/native-evidence
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          p=pathlib.Path('libs/compile-only/Tellus-neoforge-1.21.1-0.8.3.jar')
          pathlib.Path('build/native-evidence/tellus-sha256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n')
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.startswith('META-INF/jarjar/') and n.endswith('.jar'):
                      pathlib.Path('build/native-runtime',pathlib.Path(n).name).write_bytes(z.read(n))
          PY
          javap -classpath libs/compile-only/Tellus-neoforge-1.21.1-0.8.3.jar com.yucareux.tellus.worldgen.EarthGeneratorSettings com.yucareux.tellus.worldgen.EarthChunkGenerator com.yucareux.tellus.worldgen.TellusWorldgenSources > build/native-evidence/pinned-api.txt
      - name: Exercise actual Tellus online sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -I tools/tellus-native/native.init.gradle -PneoForge.disableRecompilation=true '-Dorg.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8' test --tests '*TellusNativeDataProbeTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tellus-native-${{ github.run_id }}
          path: |
            build/native-evidence/
            build/test-results/test/
            build/reports/tests/test/
          retention-days: 14
