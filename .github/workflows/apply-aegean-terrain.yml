name: Validate and apply Aegean async terrain fix
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['.github/aegean-stage/**', '.github/workflows/apply-aegean-terrain.yml']
permissions:
  contents: write
concurrency:
  group: apply-aegean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage exact source patch
        run: python .github/aegean-stage/apply.py
      - name: Reproduce coastline-only regression data
        run: |
          python -m pip install basemap==2.0.0 basemap-data==2.0.0 shapely==2.1.2 numpy==2.3.5 pyproj==3.7.2
          python tools/generate_aegean_fixture.py
          echo '9a8faa4760941e03f78f276f436bd4e45dad0f5be738839e5ea42a105d3fab71  src/test/resources/route-terrain/aegean-gshhs-i.rle' | sha256sum -c -
          git add src/test/resources/route-terrain/aegean-gshhs-i.rle
      - name: Compile, execute real coastline and port regressions, package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PneoForge.disableRecompilation=true -PfixIndex=aegean_async '-Dorg.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8' test --tests 'com.monpai.sailboatmod.route.water.*' --tests 'com.monpai.sailboatmod.route.terrain.*' --tests '*ChatFlag*Test' --tests '*NationOfficeTitleTest' --tests '*FlagPreviewLayoutTest' jar
      - name: Commit only tested sources without overwriting concurrent changes
        run: |
          git fetch origin fix/autoroute-candidates-flag-preview
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm -r .github/aegean-stage .github/workflows/apply-aegean-terrain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: defer unknown terrain edges, poll bounded IO futures, and pass Aegean coastline regression'
          git push origin HEAD:fix/autoroute-candidates-flag-preview
      - name: Archive checked sources and validation identity
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/validation-commit.txt
          git status --short > build/validation-working-tree.txt
          tar czf build/validation-source.tar.gz src/main/java src/test src/main/resources docs/handoff tools/generate_aegean_fixture.py build.gradle gradle.properties settings.gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegean-async-terrain-${{ github.run_id }}
          path: |
            build/libs/*.jar
            build/test-results/test/
            build/reports/tests/test/
            build/route-regression/
            build/validation-source.tar.gz
            build/validation-commit.txt
            build/validation-working-tree.txt
          if-no-files-found: warn
          retention-days: 14
