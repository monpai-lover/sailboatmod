name: Harbor connectors, local rescue and helm regression
on:
  push:
    branches: [fix/autoroute-candidates-flag-preview]
    paths: ['src/main/java/com/monpai/sailboatmod/route/water/**', 'src/main/java/com/monpai/sailboatmod/entity/Sailboat*.java', 'src/main/java/com/monpai/sailboatmod/entity/AutopilotRerouteRequests.java', 'src/main/java/com/monpai/sailboatmod/client/renderer/SailboatEntityRenderer.java', 'src/test/java/com/monpai/sailboatmod/route/water/**', 'src/test/java/com/monpai/sailboatmod/entity/*Rescue*Test.java']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harbor-rescue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Complete compilation, targeted road/navigation/rescue/seat tests and packaging
        run: |
          cat > /tmp/harbor-tests.gradle <<'GRADLE'
          allprojects {
            afterEvaluate {
              if (plugins.hasPlugin('java')) {
                tasks.named('test', Test) {
                  maxHeapSize = '3G'
                  filter { excludeTestsMatching '*TellusTaipeiAmsterdamBenchmark' }
                  testLogging { events 'failed', 'skipped'; showStandardStreams = true }
                }
              }
            }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew --no-daemon -I /tmp/harbor-tests.gradle -PneoForge.disableRecompilation=true -PfixIndex=harbor_rescue_helm '-Dorg.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8' test --tests '*road.*' --tests '*roadplanner.*' --tests '*route.water.*' --tests '*route.terrain.*' --tests '*WaterPolylineFollowerTest' --tests '*ShippingTraceRecordTest' --tests '*Autopilot*Test' --tests '*SailboatHelmAndRescueTest' --tests '*LookaheadGuardWiringContractTest' --tests '*ChatFlag*Test' --tests '*NationOfficeTitleTest' --tests '*FlagPreviewLayoutTest' jar marketWebJar
          cp -r build/test-results/test build/offline-test-results
      - name: Prepare pinned Tellus runtime
        run: |
          mkdir -p build/native-runtime build/native-evidence
          python3 - <<'PY'
          import pathlib,zipfile,hashlib
          p=pathlib.Path('libs/compile-only/Tellus-neoforge-1.21.1-0.8.3.jar')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='fe3287f5b7cb1e8ef9395b71462db8c4455c21ebdca5ea33eee7cd0c5b62fcb6'
          pathlib.Path('build/native-evidence/tellus-sha256.txt').write_text(digest+'\n')
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.startswith('META-INF/jarjar/') and n.endswith('.jar'):
                      pathlib.Path('build/native-runtime',pathlib.Path(n).name).write_bytes(z.read(n))
          PY
      - name: Actual Tellus terrain long routes and reverse reuse compatibility
        run: |
          ./gradlew --no-daemon -I tools/tellus-native/native.init.gradle -PneoForge.disableRecompilation=true '-Dorg.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8' test --tests '*TellusNativeRoutesTest' --rerun-tasks
      - name: Archive exact source, reports and artifact identity
        if: always()
        run: |
          mkdir -p build/native-evidence
          git rev-parse HEAD > build/native-evidence/commit.txt
          sha256sum build/libs/*.jar > build/native-evidence/jar-sha256.txt || true
          tar czf build/verified-source.tar.gz src tools docs build.gradle gradle.properties settings.gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-rescue-${{ github.run_id }}
          path: |
            build/libs/*.jar
            build/offline-test-results/
            build/test-results/test/
            build/native-evidence/
            build/harbor-evidence/
            build/road-evidence/
            build/route-regression/
            build/verified-source.tar.gz
          retention-days: 14
