name: Shared map resource guards
on:
  push:
    branches: [fix/shared-map-stream-bounds]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-map-guards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Align cached-tile regression
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/shared-map-stream-bounds
          python - <<'PY'
          from pathlib import Path
          p = Path('src/test/java/com/monpai/sailboatmod/market/web/MarketWebAppResourceTest.java')
          s = p.read_text()
          assert s.count('assertTrue(method.contains("service.mapTile"),') == 1
          s = s.replace('int end = source.indexOf("private void handleMapFlag", start);', 'int end = source.indexOf("private void handleSquareMapTile", start);', 1)
          s = s.replace('assertTrue(method.contains("service.mapTile"),', 'assertTrue(method.contains("service.readMapTile"),', 1)
          old = '                "map tile endpoint should only read cached tile bytes");'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n        int scheduledWorkEnd = method.indexOf("});");\n        assertTrue(scheduledWorkEnd >= 0 && method.indexOf("service.readMapTile(") > scheduledWorkEnd,\n                "cached PNG disk reads must remain outside the server-thread callback");\n        String square = methodBody(source, "handleSquareMapTile", "handleMapWorld");\n        assertTrue(square.contains("service.readSquareMapTile("));\n        assertFalse(square.contains("callOnServerThread("),\n                "square-tile cached reads must not wait on the game thread");')
          p.write_text(s)
          PY
          git add -- src/test/java/com/monpai/sailboatmod/market/web/MarketWebAppResourceTest.java
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Verify cached tile reads stay off the game thread [skip ci]'
          git push origin HEAD:fix/shared-map-stream-bounds
      - name: Record exact source commit
        run: |
          git rev-parse HEAD > build-commit.txt
          git archive --format=zip HEAD -o /tmp/shared-map-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shared-map-source
          path: /tmp/shared-map-source.zip
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run full test suite and build main mod
        run: |
          chmod +x gradlew
          ./gradlew test jar -PfixIndex=mapguard_1 -PneoForge.disableRecompilation=true --no-daemon --console=plain
          sha256sum build/libs/sailboatmod-*-fix_mapguard_1-neoforge-1.21.1.jar > build/libs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-map-test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sailboatmod-shared-map-guards-neoforge-1.21.1
          path: |
            build/libs/sailboatmod-*-fix_mapguard_1-neoforge-1.21.1.jar
            build/libs/SHA256SUMS
            build-commit.txt
          if-no-files-found: error
          retention-days: 14
