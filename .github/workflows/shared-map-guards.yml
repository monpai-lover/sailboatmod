name: Shared map resource guards
on:
  push:
    branches: [fix/shared-map-stream-bounds]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-map-guards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified resource-guard changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/shared-map-stream-bounds
          if [ -f .github/patches/shared-map-guards.part1 ]; then
            cat .github/patches/shared-map-guards.part1 .github/patches/shared-map-guards.part2 | gzip -dc > /tmp/shared-map-guards.patch
            echo '9b343d385360dd75f71f0c700277fce103d2fb770f44e009e330ea0a81c13245  /tmp/shared-map-guards.patch' | sha256sum -c -
            git apply --check /tmp/shared-map-guards.patch
            git apply /tmp/shared-map-guards.patch
            git rm .github/patches/shared-map-guards.part1 .github/patches/shared-map-guards.part2
            git add -- src AGENTS.md
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bound shared-map packets, admission, streaming and preload work'
            git push origin HEAD:fix/shared-map-stream-bounds
          fi
          git rev-parse HEAD > build-commit.txt
      - name: Archive exact sources
        run: git archive --format=zip HEAD -o /tmp/shared-map-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shared-map-source
          path: /tmp/shared-map-source.zip
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test map guards and build main mod
        run: |
          chmod +x gradlew
          ./gradlew test --tests '*SharedMap*' --tests '*RoadPlannerMapPreload*' --tests '*RoadPlannerPacketRoundTripTest' --tests '*RoadPlannerPredictionLayerTest' --tests '*RoadPlannerTileManagerLodIsolationTest' jar -PfixIndex=mapguard_1 -PneoForge.disableRecompilation=true --no-daemon --console=plain
          sha256sum build/libs/sailboatmod-*-fix_mapguard_1-neoforge-1.21.1.jar > build/libs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-map-test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sailboatmod-shared-map-guards-neoforge-1.21.1
          path: |
            build/libs/sailboatmod-*-fix_mapguard_1-neoforge-1.21.1.jar
            build/libs/SHA256SUMS
            build-commit.txt
          if-no-files-found: error
          retention-days: 14
